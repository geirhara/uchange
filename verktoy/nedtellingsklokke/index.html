<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nedtellingsklokke | uChange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #0F3D54;
      --brand-blue-dark: #0a2b3c;
      --brand-gold: #D4A06F;
      --brand-gold-dark: #c58f5c;
      --brand-red: #990000;
      --grey-light: #F5F5F5;
      --grey-dark: #333333;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--brand-blue);
      color: #ffffff;
      font-family: 'Montserrat', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* 16:9 stage that scales to fill the screen */
    .stage {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: 62% 38%;
      align-items: stretch;
    }
    .panel {
      display: flex;
      padding: clamp(2rem, 5vw, 5rem);
    }

    /* LEFT — the question / oppgave */
    .question-panel {
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(212,160,111,.25);
    }
    .eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: clamp(.8rem, 1.4vw, 1.1rem);
      color: var(--brand-gold);
      margin: 0 0 1.25rem;
    }
    .question {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-size: clamp(2.4rem, 5.2vw, 5rem);
      color: #ffffff;
      margin: 0;
      max-width: 30ch;
    }
    .question-sub {
      margin-top: 1.75rem;
      font-size: clamp(1rem, 1.6vw, 1.5rem);
      font-weight: 400;
      color: rgba(255,255,255,.7);
      max-width: 50ch;
    }

    /* RIGHT — countdown */
    .timer-panel {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1rem, 2.4vw, 2.25rem);
      background:
        radial-gradient(ellipse at 50% 35%, rgba(212,160,111,.10), transparent 65%),
        var(--brand-blue-dark);
    }
    .hourglass {
      width: clamp(70px, 9vw, 150px);
      height: auto;
      filter: drop-shadow(0 6px 18px rgba(0,0,0,.35));
    }
    .clock {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
      font-size: clamp(7rem, 17vw, 17rem);
      line-height: .9;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0,0,0,.3);
      white-space: nowrap;
    }
    .clock .sep { color: var(--brand-gold); }
    .timer-label {
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: clamp(.7rem, 1.1vw, .95rem);
      color: rgba(255,255,255,.55);
    }

    /* warning states */
    .clock.warn     { color: var(--brand-gold); }
    .clock.danger   { color: #ff5b5b; animation: pulse 1s ease-in-out infinite; }
    .clock.finished { color: var(--brand-red); animation: none; }
    .stage.finished .timer-label { color: #ff5b5b; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.04); opacity: .82; }
    }

    /* progress bar under the timer */
    .progress {
      width: min(80%, 460px);
      height: 6px;
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress > i {
      display: block; height: 100%; width: 100%;
      background: linear-gradient(90deg, var(--brand-gold), var(--brand-red));
      transform-origin: left;
      transition: transform .9s linear;
    }

    /* control bar (auto-hides while running) */
    .controls {
      position: fixed;
      left: 50%; bottom: 1.25rem;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: .6rem;
      background: rgba(10,43,60,.92);
      border: 1px solid rgba(212,160,111,.3);
      border-radius: 999px;
      padding: .55rem .85rem;
      backdrop-filter: blur(8px);
      z-index: 30;
      transition: opacity .4s ease, transform .4s ease;
    }
    .controls.hidden { opacity: 0; transform: translate(-50%, 120%); pointer-events: none; }
    .controls input, .controls button {
      font-family: 'Montserrat', sans-serif;
      font-size: .95rem;
      border-radius: 999px;
      border: 1px solid transparent;
    }
    .controls input {
      background: rgba(255,255,255,.08);
      color: #fff;
      padding: .5rem .8rem;
      width: 150px;
    }
    .controls input[type=number] { width: 72px; text-align: center; }
    .controls input::placeholder { color: rgba(255,255,255,.45); }
    .controls button {
      background: var(--brand-gold);
      color: var(--brand-blue);
      font-weight: 700;
      padding: .55rem 1.15rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .controls button:hover { background: #fff; }
    .controls button.ghost {
      background: transparent;
      color: rgba(255,255,255,.85);
      border-color: rgba(255,255,255,.3);
    }
    .controls button.ghost:hover { background: rgba(255,255,255,.12); color: #fff; }
    .ctrl-divider { width: 1px; height: 26px; background: rgba(255,255,255,.18); }
    .hint {
      position: fixed; left: 1rem; bottom: 1rem;
      font-size: .8rem; color: rgba(255,255,255,.35);
      z-index: 30; transition: opacity .4s;
    }
    .hint.hidden { opacity: 0; pointer-events: none; }

    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .question-panel { border-right: none; border-bottom: 1px solid rgba(212,160,111,.25); }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">

    <section class="panel question-panel">
      <p class="eyebrow">Oppgave</p>
      <h1 class="question" id="question">Hva er det viktigste dere vil ta med dere videre fra i dag?</h1>
      <p class="question-sub" id="questionSub">Snakk to og to. Lytt først, del deretter.</p>
    </section>

    <section class="panel timer-panel">
      <!-- Animated hourglass -->
      <svg class="hourglass" viewBox="0 0 100 140" aria-hidden="true">
        <defs>
          <clipPath id="topBulb"><polygon points="10,8 90,8 50,68"/></clipPath>
          <clipPath id="botBulb"><polygon points="50,72 90,132 10,132"/></clipPath>
        </defs>
        <!-- glass outline -->
        <polygon points="10,8 90,8 50,68" fill="none" stroke="#D4A06F" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="50,72 90,132 10,132" fill="none" stroke="#D4A06F" stroke-width="3" stroke-linejoin="round"/>
        <line x1="50" y1="68" x2="50" y2="72" stroke="#D4A06F" stroke-width="3"/>
        <!-- sand: top drains, bottom fills -->
        <g clip-path="url(#topBulb)">
          <rect id="sandTop" x="6" y="8" width="88" height="60" fill="#D4A06F"/>
        </g>
        <g clip-path="url(#botBulb)">
          <rect id="sandBot" x="6" y="132" width="88" height="0" fill="#D4A06F"/>
        </g>
        <!-- falling stream -->
        <line id="stream" x1="50" y1="70" x2="50" y2="130" stroke="#D4A06F" stroke-width="2" opacity="0"/>
      </svg>

      <div class="clock" id="clock"><span id="mm">02</span><span class="sep">:</span><span id="ss">00</span></div>
      <div class="timer-label" id="timerLabel">Tid igjen</div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    </section>
  </main>

  <!-- controls -->
  <div class="controls" id="controls">
    <input id="qInput" type="text" placeholder="Spørsmål / oppgave" aria-label="Spørsmål" />
    <div class="ctrl-divider"></div>
    <input id="minInput" type="number" min="0" max="180" value="2" aria-label="Minutter" />
    <span style="color:rgba(255,255,255,.5)">:</span>
    <input id="secInput" type="number" min="0" max="59" value="0" aria-label="Sekunder" />
    <div class="ctrl-divider"></div>
    <button id="startBtn">Start</button>
    <button id="pauseBtn" class="ghost">Pause</button>
    <button id="resetBtn" class="ghost">Nullstill</button>
  </div>
  <div class="hint" id="hint">Trykk H for å skjule/vise kontrollene &middot; F for fullskjerm &middot; Mellomrom for start/pause</div>

  <script>
  (function () {
    "use strict";

    var stage      = document.getElementById("stage");
    var clockEl    = document.getElementById("clock");
    var mmEl       = document.getElementById("mm");
    var ssEl       = document.getElementById("ss");
    var labelEl    = document.getElementById("timerLabel");
    var barEl      = document.getElementById("bar");
    var qEl        = document.getElementById("question");
    var qSubEl     = document.getElementById("questionSub");
    var sandTop    = document.getElementById("sandTop");
    var sandBot    = document.getElementById("sandBot");
    var stream     = document.getElementById("stream");
    var controls   = document.getElementById("controls");
    var hint       = document.getElementById("hint");
    var qInput     = document.getElementById("qInput");
    var minInput   = document.getElementById("minInput");
    var secInput   = document.getElementById("secInput");
    var startBtn   = document.getElementById("startBtn");
    var pauseBtn   = document.getElementById("pauseBtn");
    var resetBtn   = document.getElementById("resetBtn");

    // hourglass geometry (matches viewBox 0..140)
    var TOP_Y = 8, TOP_H = 60;   // top bulb spans y=8..68
    var BOT_Y = 132;             // bottom bulb base

    var total = 120;     // total seconds
    var remaining = 120; // seconds left
    var running = false;
    var ticker = null;
    var lastTick = 0;

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function setQuestion(text) {
      if (text == null || text === "") return;
      qEl.textContent = text;
      qInput.value = text;
    }
    function setSub(text) {
      if (text == null) return;
      qSubEl.textContent = text;
      qSubEl.style.display = text ? "" : "none";
    }

    function render() {
      var m = Math.floor(remaining / 60);
      var s = remaining % 60;
      mmEl.textContent = pad(m);
      ssEl.textContent = pad(s);

      // state classes
      clockEl.classList.remove("warn", "danger", "finished");
      stage.classList.remove("finished");
      if (remaining <= 0) {
        clockEl.classList.add("finished");
        stage.classList.add("finished");
        labelEl.textContent = "Tiden er ute!";
      } else if (remaining <= 10) {
        clockEl.classList.add("danger");
        labelEl.textContent = "Tid igjen";
      } else if (remaining <= 30) {
        clockEl.classList.add("warn");
        labelEl.textContent = "Tid igjen";
      } else {
        labelEl.textContent = "Tid igjen";
      }

      // progress bar (fraction remaining)
      var frac = total > 0 ? remaining / total : 0;
      barEl.style.transform = "scaleX(" + frac + ")";

      // hourglass: top sand drains as time passes
      var elapsedFrac = total > 0 ? (total - remaining) / total : 0;
      var topH = Math.max(0, TOP_H * (1 - elapsedFrac));
      var botH = Math.max(0, TOP_H * elapsedFrac);
      sandTop.setAttribute("height", topH);
      sandBot.setAttribute("y", BOT_Y - botH);
      sandBot.setAttribute("height", botH);
      stream.setAttribute("opacity", (running && remaining > 0) ? "0.9" : "0");
    }

    function configure() {
      var m = Math.max(0, parseInt(minInput.value, 10) || 0);
      var s = Math.max(0, Math.min(59, parseInt(secInput.value, 10) || 0));
      total = m * 60 + s;
      if (total <= 0) total = 60;
      remaining = total;
      render();
    }

    function tick(now) {
      var dt = now - lastTick;
      if (dt >= 1000) {
        lastTick += 1000;
        remaining = Math.max(0, remaining - 1);
        render();
        if (remaining <= 0) { stop(); return; }
      }
      if (running) ticker = requestAnimationFrame(tick);
    }

    function start() {
      if (remaining <= 0) configure();
      if (running) return;
      running = true;
      lastTick = performance.now();
      controls.classList.add("hidden");
      hint.classList.add("hidden");
      startBtn.textContent = "Start";
      ticker = requestAnimationFrame(tick);
      render();
    }

    function pause() {
      if (!running) return;
      running = false;
      if (ticker) cancelAnimationFrame(ticker);
      stream.setAttribute("opacity", "0");
      startBtn.textContent = "Fortsett";
      controls.classList.remove("hidden");
      render();
    }

    function stop() {
      running = false;
      if (ticker) cancelAnimationFrame(ticker);
      stream.setAttribute("opacity", "0");
      controls.classList.remove("hidden");
      render();
    }

    function reset() {
      stop();
      configure();
      startBtn.textContent = "Start";
    }

    function toggleStartPause() {
      if (running) pause(); else start();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }

    function toggleControls() {
      controls.classList.toggle("hidden");
      hint.classList.toggle("hidden");
    }

    // events
    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);
    minInput.addEventListener("change", reset);
    secInput.addEventListener("change", reset);
    qInput.addEventListener("input", function () { setQuestion(qInput.value); });

    document.addEventListener("keydown", function (e) {
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" && e.key !== "Enter") return;
      switch (e.key) {
        case " ":      e.preventDefault(); toggleStartPause(); break;
        case "Enter":  e.preventDefault(); toggleStartPause(); break;
        case "r": case "R": reset(); break;
        case "f": case "F": toggleFullscreen(); break;
        case "h": case "H": toggleControls(); break;
        case "Escape": pause(); break;
      }
    });

    // init from URL: ?q=...&sub=...&m=2&s=0
    var params = new URLSearchParams(location.search);
    var q = params.get("q");
    var sub = params.get("sub");
    var m = params.get("m");
    var s = params.get("s");
    if (m != null) minInput.value = m;
    if (s != null) secInput.value = s;
    if (sub != null) setSub(sub);
    setQuestion(q != null ? q : qEl.textContent);

    configure();
    render();
  })();
  </script>
</body>
</html>
